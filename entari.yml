# Minimal offline-ready runtime. No account or model credentials are needed.
# Copy entari.full.example.yml to entari.local.yml to opt into more features.
basic:
  network: []
  log:
    level: info
    rich_error: false
  prefix: ["/", "."]
  external_dirs: ["./plugins"]
plugins:
  .localdata:
    app_name: chtholly
  ::echo: {}
  database:
    type: sqlite
    name: data/chtholly.db
    create_table_at: preparing
  server:
    host: 127.0.0.1
    port: 8120
    path: satori
    direct_adapter: true
    options:
      access_log: false
      loop: asyncio
    adapters: []
