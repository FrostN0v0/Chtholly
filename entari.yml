# Chtholly — Entari configuration
# Docs: https://arclet.top/tutorial/entari/
# Sensitive values go in .env and are interpolated via ${{ env.KEY }}.

basic:
  # Satori server connection. With entari-plugin-server + direct_adapter,
  # the server plugin runs the ASGI server in-process and adapters dial out.
  network:
    - type: ws
      host: "127.0.0.1"
      port: 5140
      path: "satori"
      ignore_self_message: true
  log:
    level: INFO
    save: true
    rotation: "00:00"
    compression: "zip"
    rich_error: true
  prefix: ["/", "."]
  nickname: ["珂朵莉", "佩佩"]
  superusers:
    qq: ["${{ env.SUPERUSER_QQ_1 }}", "${{ env.SUPERUSER_QQ_2 }}"]
  str_as_message: true
  external_dirs: ["./plugins"]

plugins:
  $prelude:
    - "::auto_reload"

  # Built-in helpers
  .record_message: { record_send: true }
  .commands: { use_config_prefix: true }
  .scheduler: {}
  .localdata: { use_global: false, app_name: "chtholly" }
  ::echo: {}
  ::help: { page_size: null }
  ::inspect: {}
  ::control: {}
  ::auto_reload:
    watch_dirs: ["./plugins", "./utils"]
    watch_config: true

  # Satori server + adapters (OneBot V11 forward by default)
  server:
    direct_adapter: true
    adapters:
      - $path: "@onebot11.forward"
        endpoint: "${{ env.ONEBOT11_ENDPOINT }}"
        access_token: "${{ env.ONEBOT11_ACCESS_TOKEN }}"

  # Local plugins (loaded from ./plugins via external_dirs)
  plugin_manager: {}
  poke: {}
  mockingbird: {}
  fox: {}
  dinggong_voice: {}
