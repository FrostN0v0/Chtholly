basic:
  # network:
  #   - type: ws
  #     host: localhost
  #     port: 8120
  #     path: satori
  #     token: chtholly4221
  ignore_self_message: true
  log:
    level: debug
    save: true
    rotation: "00:00"
    compression: "zip"
    rich_error: true
    short_level: true
  prefix:
    - /
    - .
  nickname: "Chtholly"
  superusers:
    onebot:
      - "1614591760"
    qq:
      - "1614591760"
  external_dirs: ["./plugins"]

plugins:
  $prelude:
    - "::auto_reload"

  $prefix:
    - key: ""
      plugins: ["poke", "tts_service", "help_menu", "llm_chat"]

  .record_message:
    record_send: true
  .scheduler: {}
  .localdata:
    app_name: "chtholly"
  ::echo: {}
  ::inspect: {}
  browser: {}
  database:
    type: sqlite
    name: "data/chtholly.db"
  ::auto_reload:
    watch_dirs: ["./plugins", "./utils"]
    watch_config: true
  entari_plugin_webui:
    password: ${{ env.WEBUI_PASSWORD }}
  llm:
    api_key: ${{ env.LLM_API_KEY }}
    base_url: ${{ env.LLM_BASE_URL }}
    models:
      - name: "gpt-5.5"
        alias: "gpt"
      - name: "openai/doubao-seed-2-1-pro-260628"
        alias: "doubao"
        base_url: "https://ark.cn-beijing.volces.com/api/v3/"
        api_key: ${{ env.DOUBAO_API_KEY }}
      - name: "openai/deepseek-ai/DeepSeek-V4-Flash"
        alias: "deepseek"
        base_url: "https://api.siliconflow.cn/v1"
        api_key: ${{ env.DEEPSEEK_API_KEY }}

    prompt: |
      1. 你是一个由用户提供信息并回答问题的智能助手。请根据用户提供的信息，尽可能准确和简洁地回答他们的问题。
      2. 如果信息不足以回答问题，请礼貌地告知用户需要更多信息。
      3. 如果你的回答超过了30字，请将你的回答进行分段，然后调用 `split_answer_send` 工具将多段回答进行发送。
      4. 然后，语气根据变量：亲密度 (`trust`) 来衡量，亲密度高就表现的可爱一些，反之则冷淡一点。
  tts_service:
    api_url: ${{ env.TTS_API_URL || "http://127.0.0.1:9880/tts" }}
    default_speaker: "chtholly"
    text_lang: "zh"
  help_menu: {}
  llm_chat:
    $filter: channel.type is public
    persona: 你是珂朵莉(Chtholly)，红发蓝瞳的少女，性格底色温柔、略带倔强。
    image_tag_model: doubao
    tag_batch_size: 50
    memory_enabled: true
    memory_embedding_model: "volcengine/doubao-embedding-vision-251215"
    memory_embedding_api_key: ${{ env.DOUBAO_API_KEY }}
    memory_embedding_base_url: "https://ark.cn-beijing.volces.com/api/v3"
    image_tag_prompt: |
      只输出一行中文标签，用中文逗号分隔；不要编号、解释或 Markdown。
      给出 12-20 个短标签，优先描述适合聊天选图的情绪、语气、回复场景、主体、动作表情和明显风格。
      仅在画面支持时使用如 开心、害羞、生气、吐槽、安慰、早安、晚安、可爱、狐娘 等标签。
      避免只给 动漫 这类宽泛标签；宽泛风格必须搭配具体情绪或场景。
  server:
    direct_adapter: true
    access_token: ${{ env.ONEBOT_TOKEN }}
    port: 8120
    path: satori
    token: chtholly4221
    adapters:
      - $path: "@onebot11.reverse"
        access_token: ${{ env.ONEBOT_TOKEN }}
        path: "onebot/v11"
        endpoint: "ws"
  poke: {}

