[project]
name = "Chtholly"
version = "0.1.0"
description = "Chtholly"
readme = "README.md"
authors = [{ name = "FrostN_0v0", email = "suny25802@gmail.com" }]
license = { text = "AGPL-3.0" }
requires-python = ">=3.10, <3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "arclet-entari[full]==0.19.0rc2",
    "entari-plugin-browser[jinja2]>=0.6.1",
    "entari-plugin-database>=0.3.3",
    "entari-plugin-htmlrender[playwright]>=0.1.0,<0.2",
    "entari-plugin-llm>=0.2.1",
    "entari-plugin-permission>=0.1.1",
    "entari-plugin-server>=0.7.1",
    "entari-plugin-user>=0.2.0",
    "entari-plugin-webui>=1.0.1",
    "exa-py>=2.16.2",
    "httpx[http2]>=0.27.2",
    "jsonschema>=4.23,<5",
    "markdown>=3.10",
    "orjson>=3.11.9",
    "psutil>=7.0.0",
    "rich>=13.9.4",
    "satori-python-adapter-qq>=0.4.2",
    "tzdata>=2026.3",
]

[tool.uv]
# HTMLRender 0.1.0 has a conservative Entari upper bound; validate the pinned RC as a unit.
override-dependencies = ["arclet-entari[full,pydantic]==0.19.0rc2"]
# The upstream LLM tool bridge still imports helpers removed in Agno 3.
# LiteLLM 1.97+ breaks Python 3.10 response schemas; 1.98+ also fails at import.
constraint-dependencies = ["agno<3", "litellm<1.97; python_version < '3.11'"]

[tool.uv.sources]
entari-plugin-llm = { git = "https://github.com/ArcletProject/entari-plugin-llm", rev = "1845f1c3c65f9df4493e97f96a4c43938b176320" }
arclet-entari = { path = "vendor/entari/arclet_entari-0.19.0rc2+chtholly.2-py3-none-any.whl" }
entari-plugin-webui = { path = "vendor/webui/entari_plugin_webui-1.0.3+chtholly.1-py3-none-any.whl" }
entari-plugin-htmlrender = { path = "vendor/htmlrender/entari_plugin_htmlrender-0.1.0+chtholly.1-py3-none-any.whl" }

[project.optional-dependencies]
adapters = [
  "satori-python-adapter-onebot11>=0.4.4",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q", "I"]
ignore = ["E402", "C901"]

[tool.ruff.lint.isort]
length-sort = true
force-sort-within-sections = true
combine-as-imports = true
extra-standard-library = ["typing_extensions"]


[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pillow==11.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
