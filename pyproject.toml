[project]
name = "Chtholly"
version = "0.1.0"
description = "Chtholly"
readme = "README.md"
authors = [{ name = "FrostN_0v0", email = "suny25802@gmail.com" }]
license = { text = "AGPL-3.0" }
requires-python = ">=3.14, <4.0"
dependencies = [
    "arclet-entari[full]>=0.18.0",
    "entari-cli>=0.4.1",
    "entari-plugin-server>=0.1.0",
    "satori-python-adapter-onebot11>=0.1.0",
    "httpx[http2]>=0.27.2",
    "rich>=13.9.4",
]

[tool.uv]
override-dependencies = [
    "httpx[http2]==0.27.2",
]

[project.optional-dependencies]
adapters = [
    "satori-python-adapter-milky>=0.1.0",
    "satori-python-adapter-qq>=0.1.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "W",   # pycodestyle warnings
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "T10", # flake8-debugger
  "T20", # flake8-print
  "PYI", # flake8-pyi
  "PT",  # flake8-pytest-style
  "Q",   # flake8-quotes
  "TC",  # flake8-type-checking
  "RUF", # Ruff-specific rules
  "I",   # isort
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
]

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "basic"
