# Client credentials, issuer and redirect URL come from the root-owned environment file.
provider = "oidc"
provider_display_name = "Casdoor"
http_address = "127.0.0.1:4180"
reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1/32"]
real_client_ip_header = "X-Real-IP"
upstreams = ["http://127.0.0.1:8120/"]
pass_host_header = true
proxy_websockets = true
upstream_timeout = "330s"

# The Casdoor application's grantTypes must contain authorization_code AND refresh_token.
# offline_access and a positive refresh-token lifetime do not enable the refresh grant.
scope = "openid profile email offline_access"
email_domains = ["*"]
# Casdoor application access, not email ownership, grants this deployment's administrator access.
oidc_email_claim = "sub"
insecure_oidc_allow_unverified_email = true
code_challenge_method = "S256"
auth_request_response_mode = "query"
insecure_oidc_skip_nonce = false
skip_provider_button = true
skip_jwt_bearer_tokens = false
skip_auth_preflight = false

cookie_name = "__Host-chtholly_sso"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "12h"
cookie_csrf_expire = "1h"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 4
# Keep refresh tokens only in the authenticated loopback store; concurrent requests share its refresh lock.
session_store_type = "redis"
redis_connection_url = "redis://127.0.0.1:6381/0"
cookie_refresh = "5m"

pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
set_authorization_header = false
set_xauthrequest = false
skip_auth_strip_headers = true
api_routes = ["^/api/", "^/ws/logs$", "^/assets/", "^/favicon\\.(ico|svg)$"]

request_logging = false
standard_logging = false
auth_logging = true
auth_logging_format = "{{.Status}}"
show_debug_on_error = false
silence_ping_logging = true
