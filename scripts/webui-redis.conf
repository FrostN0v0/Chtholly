# Install root:redis 0640; the separate root:redis 0640 ACL contains the generated password hash.
bind 127.0.0.1
port 6381
protected-mode yes
aclfile /etc/chtholly-webui/redis.acl
dir /var/lib/chtholly-webui-sessions
daemonize no
loglevel warning
logfile ""
save ""
appendonly yes
appendfsync everysec
maxmemory 64mb
maxmemory-policy noeviction
maxclients 128
