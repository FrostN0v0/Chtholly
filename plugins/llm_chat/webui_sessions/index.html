<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LLM 会话检查器</title>
  <!-- SESSION_STYLES -->
</head>
<body>
  <div class="app">
    <div class="context-bar">
      <div class="context-picker">
        <label for="scope-select">&#39057;&#36947;</label>
        <select id="scope-select" aria-label="&#36873;&#25321;&#32842;&#22825;&#33539;&#22260;"></select>
      </div>
      <div class="context-actions">
        <span id="status" role="status" aria-live="polite">正在连接…</span>
        <span id="auto-refresh" class="is-hidden">自动刷新中</span>
        <button id="refresh-button" type="button">刷新</button>
        <button id="session-details-button" class="session-info" type="button" disabled>&#39057;&#36947;&#20449;&#24687;</button>
        <details class="admin-menu">
          <summary>&#31649;&#29702;</summary>
          <div class="context-popover session-controls">
            <button id="new-session-button" type="button" disabled>&#26032;&#20250;&#35805;</button>
            <button id="rollover-button" type="button" disabled>&#25658;&#24102;&#19978;&#19979;&#25991;&#32493;&#25509;</button>
            <button id="hard-reset-button" class="danger" type="button" disabled>&#30828;&#37325;&#32622;</button>
          </div>
        </details>
      </div>
    </div>
    <main id="sessions-workspace" class="workspace" data-view="list">
      <section class="panel turn-panel" aria-label="&#20250;&#35805;&#35760;&#24405;">
        <div class="panel-head">
          <h2>&#20250;&#35805;&#35760;&#24405; <span id="session-count" class="muted">0</span></h2>
          <button id="turn-order-button" class="quiet-button" type="button" aria-pressed="true">&#26368;&#26032;&#22312;&#19978;</button>
        </div>
        <nav id="turn-list" class="scroll list session-tree" aria-label="&#26222;&#36890;&#20250;&#35805;"></nav>
      </section>
      <section class="panel inspector" aria-label="&#36718;&#27425;&#24037;&#20316;&#21306;" data-overview-open="false">
        <button id="back-to-turns" class="back-button" type="button">&#8592; &#20250;&#35805;&#35760;&#24405;</button>
        <div class="detail-heading">
          <div id="turn-header" class="turn-header">&#35831;&#36873;&#25321;&#19968;&#20010;&#20250;&#35805;&#12290;</div>
          <div class="inspector-navigation">
            <details id="inspection-menu" class="inspection-menu">
              <summary id="inspection-label">&#23545;&#35805;&#35760;&#24405;</summary>
              <div class="tabs" role="tablist" aria-label="&#26816;&#26597;&#20869;&#23481;">
                <button id="tab-io" class="tab is-active" role="tab" aria-selected="true" aria-controls="io-view" data-tab="io" type="button">&#23545;&#35805;&#35760;&#24405;</button>
                <button id="tab-timeline" class="tab" role="tab" aria-selected="false" aria-controls="timeline-view" data-tab="timeline" tabindex="-1" type="button">&#35831;&#27714;&#26126;&#32454;</button>
                <button id="tab-context" class="tab" role="tab" aria-selected="false" aria-controls="context-view" data-tab="context" tabindex="-1" type="button">&#19978;&#19979;&#25991;</button>
                <button id="tab-relationship" class="tab" role="tab" aria-selected="false" aria-controls="relationship-view" data-tab="relationship" tabindex="-1" type="button">&#20851;&#31995;</button>
              </div>
            </details>
            <div class="inspector-actions">
              <button id="overview-toggle" class="quiet-button overview-toggle" type="button" aria-controls="turn-overview" aria-expanded="false" disabled>&#20449;&#24687;</button>
              <button id="collapse-details-button" class="collapse-button" type="button" aria-label="&#25240;&#21472;&#26412;&#36718;&#20840;&#37096;&#35814;&#24773;" disabled>&#20840;&#37096;&#25240;&#21472;</button>
            </div>
          </div>
        </div>
        <div class="inspector-layout">
          <div class="inspector-main">
            <div class="scroll inspector-body">
              <div id="io-view" class="view" role="tabpanel" aria-labelledby="tab-io" tabindex="0"></div>
              <div id="timeline-view" class="view" role="tabpanel" aria-labelledby="tab-timeline" tabindex="0" hidden></div>
              <div id="context-view" class="view" role="tabpanel" aria-labelledby="tab-context" tabindex="0" hidden></div>
              <div id="relationship-view" class="view" role="tabpanel" aria-labelledby="tab-relationship" tabindex="0" hidden></div>
            </div>
          </div>
          <aside id="turn-overview" class="scroll turn-overview" aria-label="&#36816;&#34892;&#27010;&#35272;"></aside>
        </div>
      </section>
    </main>
  </div>
  <dialog id="session-dialog" class="modal modal-session" aria-labelledby="session-title">
    <form method="dialog" class="modal-card">
      <header class="modal-head"><div><p class="eyebrow">&#39057;&#36947;&#20449;&#24687;</p><h2 id="session-title">&#39057;&#36947;&#20449;&#24687;</h2></div><button type="submit" aria-label="&#20851;&#38381;&#39057;&#36947;&#20449;&#24687;">&#20851;&#38381;</button></header>
      <div class="modal-body"><div id="scope-meta" class="muted"></div><div id="scope-overview"></div><div id="scope-review-history"></div><div id="session-detail" class="session-detail"></div></div>
    </form>
  </dialog>
  <dialog id="native-dialog" class="modal modal-wide" aria-labelledby="native-title">
    <form method="dialog" class="modal-card">
      <header class="modal-head"><h2 id="native-title">&#21407;&#29983;&#36718;&#27425;&#35777;&#25454;</h2><button type="submit">&#20851;&#38381;</button></header>
      <div id="native-body" class="modal-body"></div>
    </form>
  </dialog>
  <dialog id="payload-dialog" class="modal modal-wide" aria-labelledby="payload-title">
    <form method="dialog" class="modal-card">
      <header class="modal-head"><h2 id="payload-title">记录详情</h2><button type="submit" aria-label="关闭详情">关闭</button></header>
      <div class="modal-body">
        <div class="payload-toolbar">
          <div class="segmented" role="group" aria-label="&#20869;&#23481;&#26174;&#31034;&#26041;&#24335;">
            <button id="payload-reader-button" type="button" aria-pressed="true">&#38405;&#35835;</button>
            <button id="payload-source-button" type="button" aria-pressed="false">&#21407;&#22987;&#25968;&#25454;</button>
          </div>
          <span id="payload-meta" role="status" aria-live="polite"></span>
          <button id="payload-copy-button" type="button" disabled>&#22797;&#21046;&#24050;&#21152;&#36733;</button>
        </div>
        <div id="payload-reader" class="payload-reader" tabindex="0"></div>
        <pre id="payload-output" class="code payload-code" tabindex="0" hidden></pre>
        <details class="payload-filter"><summary>&#23383;&#27573;&#36873;&#25321;</summary><div class="payload-controls"><label for="payload-path">&#23383;&#27573;&#36335;&#24452;</label><input id="payload-path" autocomplete="off" placeholder="messages / arguments"><button id="payload-load-button" type="button">&#35835;&#21462;</button></div></details>
        <p id="payload-error" class="error" role="alert"></p>
      </div>
      <footer class="modal-foot actions">
        <button id="payload-next-button" type="button" disabled>继续加载</button>
        <button id="payload-all-button" type="button" disabled>加载完整</button>
        <button id="payload-stop-button" type="button" hidden>停止加载</button>
        <button id="pin-event-button" type="button" disabled>固定事件</button>
      </footer>
    </form>
  </dialog>
  <dialog id="image-dialog" class="modal" aria-labelledby="image-title">
    <form method="dialog" class="modal-card">
      <header class="modal-head"><h2 id="image-title">图片预览</h2><button type="submit">关闭</button></header>
      <div class="modal-body"><img id="image-preview" class="image-preview" alt="事件关联图片"><p id="image-caption" class="muted"></p></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" class="modal modal-compact" aria-labelledby="confirm-title">
    <form method="dialog" class="modal-card" id="confirm-form">
      <header class="modal-head"><h2 id="confirm-title">确认操作</h2></header>
      <div class="modal-body">
        <p id="confirm-message"></p>
        <label id="confirmation-field" class="confirmation-field" hidden>输入 CONFIRM 以继续<input id="confirmation-input" autocomplete="off" placeholder="CONFIRM"></label>
        <p id="confirm-error" class="error" role="alert"></p>
      </div>
      <footer class="modal-foot actions"><button id="confirm-cancel-button" value="cancel" type="submit" autofocus>取消</button><button id="confirm-action-button" class="primary" type="button">确认</button></footer>
    </form>
  </dialog>
  <!-- SESSION_SCRIPT -->
</body>
</html>
