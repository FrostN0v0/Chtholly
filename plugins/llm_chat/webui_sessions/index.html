<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LLM 会话检查器</title>
  <link rel="stylesheet" href="/api/llm-chat/sessions/assets/app.css">
  <script src="/api/llm-chat/sessions/assets/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-heading">
        <h1>会话检查器</h1>
        <p class="muted">先看摘要，按需展开调用与上下文详情。</p>
      </div>
      <div class="actions">
        <span id="status" role="status" aria-live="polite">正在连接…</span>
        <span id="auto-refresh" class="is-hidden">自动刷新中</span>
        <button id="refresh-button" type="button">刷新</button>
      </div>
    </header>
    <main class="workspace">
      <aside class="panel sidebar" aria-label="频道与会话">
        <div class="panel-head scope-picker">
          <label for="scope-select">频道 / 私聊</label>
          <select id="scope-select" aria-label="选择聊天范围"></select>
          <p id="scope-meta" class="muted">尚未选择聊天范围</p>
        </div>
        <div class="panel-head"><h2>会话</h2><span id="session-count" class="muted">0</span></div>
        <nav id="session-list" class="scroll list" aria-label="会话列表"></nav>
        <div class="session-controls actions">
          <button id="new-session-button" type="button" disabled>新会话</button>
          <button id="rollover-button" type="button" disabled>续接</button>
          <details class="admin-menu"><summary>管理</summary><button id="hard-reset-button" class="danger" type="button" disabled>硬重置</button></details>
        </div>
      </aside>
      <section class="panel turn-panel" aria-label="轮次列表">
        <div class="panel-head"><h2>轮次</h2><span id="turn-count" class="muted">0</span></div>
        <div id="session-detail" class="session-detail">请选择一个会话。</div>
        <nav id="turn-list" class="scroll list" aria-label="选择轮次"></nav>
      </section>
      <section class="panel inspector" aria-label="轮次工作区">
        <div id="turn-header" class="turn-header">请选择一个轮次。</div>
        <div class="inspector-navigation">
        <div class="tabs" role="tablist" aria-label="检查内容">
          <button id="tab-timeline" class="tab is-active" role="tab" aria-selected="true" aria-controls="timeline-view" data-tab="timeline" type="button">调用时间线</button>
          <button id="tab-context" class="tab" role="tab" aria-selected="false" aria-controls="context-view" data-tab="context" tabindex="-1" type="button">上下文注入</button>
          <button id="tab-io" class="tab" role="tab" aria-selected="false" aria-controls="io-view" data-tab="io" tabindex="-1" type="button">输入与输出</button>
        </div>
          <button id="collapse-details-button" class="collapse-button" type="button" aria-label="折叠本轮全部详情" disabled>全部折叠</button>
        </div>
        <div class="scroll inspector-body">
          <div id="timeline-view" class="view" role="tabpanel" aria-labelledby="tab-timeline" tabindex="0"></div>
          <div id="context-view" class="view" role="tabpanel" aria-labelledby="tab-context" tabindex="0" hidden></div>
          <div id="io-view" class="view" role="tabpanel" aria-labelledby="tab-io" tabindex="0" hidden></div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="payload-dialog" class="modal modal-wide" aria-labelledby="payload-title">
    <form method="dialog" class="modal-card">
      <header class="modal-head"><h2 id="payload-title">记录详情</h2><button type="submit" aria-label="关闭详情">关闭</button></header>
      <div class="modal-body">
        <p class="muted">显示已记录的脱敏内容；未记录的原始数据无法还原。复制只包含当前已加载内容。</p>
        <details><summary>字段过滤</summary><div class="payload-controls"><label for="payload-path">字段路径</label><input id="payload-path" autocomplete="off" placeholder="例如 messages 或 arguments"><button id="payload-load-button" type="button">读取</button></div></details>
        <div class="payload-controls"><span id="payload-meta" role="status" aria-live="polite"></span><button id="payload-copy-button" type="button" disabled>复制已加载</button></div>
        <pre id="payload-output" class="code payload-code" tabindex="0"></pre>
        <p id="payload-error" class="error" role="alert"></p>
      </div>
      <footer class="modal-foot actions">
        <button id="payload-next-button" type="button" disabled>继续加载</button>
        <button id="payload-all-button" type="button" disabled>加载完整</button>
        <button id="payload-stop-button" type="button" hidden>停止加载</button>
        <button id="pin-event-button" type="button" disabled>固定事件</button>
      </footer>
    </form>
  </dialog>
  <dialog id="image-dialog" class="modal" aria-labelledby="image-title">
    <form method="dialog" class="modal-card">
      <header class="modal-head"><h2 id="image-title">图片预览</h2><button type="submit">关闭</button></header>
      <div class="modal-body"><img id="image-preview" class="image-preview" alt="事件关联图片"><p id="image-caption" class="muted"></p></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" class="modal modal-compact" aria-labelledby="confirm-title">
    <form method="dialog" class="modal-card" id="confirm-form">
      <header class="modal-head"><h2 id="confirm-title">确认操作</h2></header>
      <div class="modal-body">
        <p id="confirm-message"></p>
        <label id="confirmation-field" class="confirmation-field" hidden>输入 CONFIRM 以继续<input id="confirmation-input" autocomplete="off" placeholder="CONFIRM"></label>
        <p id="confirm-error" class="error" role="alert"></p>
      </div>
      <footer class="modal-foot actions"><button id="confirm-cancel-button" value="cancel" type="submit" autofocus>取消</button><button id="confirm-action-button" class="primary" type="button">确认</button></footer>
    </form>
  </dialog>
</body>
</html>
