<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>提醒任务</title>
  <!-- REMINDER_STYLES -->
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">LLM · REMINDERS</p><h1>提醒任务</h1></div>
      <button id="refresh" type="button">刷新</button>
    </header>
    <section class="notice" aria-label="管理范围">
      <strong>管理员任务管理</strong>
      <p>按来源会话筛选，或选择“所有任务”查看未归属任务。任务操作使用当前 WebUI 登录，独立于聊天用户身份。已确认的发送不代表任务目标已完成。</p>
    </section>
    <div class="scope-control"><label for="scope-select">来源会话</label><select id="scope-select" aria-label="选择来源会话"><option value="all">所有任务</option></select></div>
    <div class="toolbar"><span id="status" role="status" aria-live="polite">正在读取…</span><span id="count"></span></div>
    <section id="tasks" class="tasks" aria-label="任务列表"></section>
    <footer class="footer"><button id="more" type="button" hidden>加载更多</button></footer>
  </main>
  <!-- REMINDER_SCRIPT -->
</body>
</html>
